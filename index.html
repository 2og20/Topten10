<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPTEN10 Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f8fafc; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: contain;
        }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card-grad { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .active-press:active { transform: scale(0.96); transition: 0.1s; }
        
        @media print {
            body * { visibility: hidden; }
            #invoice-to-save, #invoice-to-save * { visibility: visible; }
            #invoice-to-save { position: fixed; left: 0; top: 0; width: 100%; }
        }
    </style>
</head><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TOPTEN10">
<link rel="apple-touch-icon" href="https://your-image-link.png">
<body class="pb-32">

    <!-- نافذة الفاتورة -->
    <div id="invoice-modal" class="fixed inset-0 bg-slate-900/95 z-[200] hidden items-center justify-center p-4 overflow-y-auto">
        <div class="w-full max-w-sm">
            <div id="invoice-to-save" class="bg-white rounded-[2.5rem] p-8 shadow-2xl">
                <div class="text-center border-b-2 border-dashed border-slate-200 pb-4 mb-4">
                    <h2 class="text-2xl font-black text-indigo-600 tracking-tighter">TOPTEN10</h2>
                    <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">فاتورة مبيعات ذكية</p>
                </div>
                
                <div class="space-y-4 text-sm">
                    <div class="flex justify-between text-[10px] font-bold">
                        <span class="text-slate-400">رقم العملية:</span> <span id="inv-id" class="text-slate-800">#0000</span>
                    </div>
                    <div class="flex justify-between text-[10px] font-bold">
                        <span class="text-slate-400">التاريخ:</span> <span id="inv-date" class="text-slate-800">--/--</span>
                    </div>
                    <hr class="border-dashed border-slate-100">
                    <div class="py-2">
                        <div class="flex justify-between items-center mb-1">
                            <span id="inv-item" class="font-black text-slate-800 text-lg">المنتج</span>
                            <span id="inv-qty" class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-black text-xs">x1</span>
                        </div>
                        <div class="flex justify-between text-[11px] font-bold">
                            <span class="text-slate-400">السعر الأصلي:</span>
                            <span id="inv-original-price" class="text-slate-600">0</span>
                        </div>
                        <div id="inv-discount-row" class="flex justify-between text-[11px] font-bold text-red-500 hidden">
                            <span>الخصم الممنوح:</span>
                            <span>- <span id="inv-discount-val">0</span></span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center bg-slate-900 p-5 rounded-3xl text-white shadow-xl shadow-slate-200">
                        <span class="font-bold text-[10px] opacity-60">الإجمالي الصافي</span>
                        <span id="inv-total" class="text-2xl font-black">0</span>
                    </div>
                </div>
                <div class="mt-8 pt-4 border-t border-slate-50 text-center">
                    <p class="text-[8px] text-slate-300 font-black uppercase tracking-widest">شكراً لثقتكم بنا</p>
                </div>
            </div>

            <div class="mt-6 space-y-3">
                <button onclick="downloadPDF()" class="w-full bg-green-500 text-white py-4 rounded-3xl font-black shadow-lg active-press">حفظ كـ PDF</button>
                <button onclick="closeInvoice()" class="w-full bg-white/10 text-white py-4 rounded-3xl font-black text-xs backdrop-blur-md border border-white/20 active-press">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="glass sticky top-0 z-50 border-b border-slate-100 p-4 mb-4">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-indigo-600 tracking-tighter">TOPTEN10</h1>
                <p id="current-date-display" class="text-[9px] text-slate-400 font-black uppercase"></p>
            </div>
            <button onclick="showTab('settings')" class="bg-slate-50 p-3 rounded-2xl text-slate-400 active-press">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4">
        <!-- Dashboard -->
        <section id="dash" class="tab-content active space-y-4">
            <div class="card-grad p-6 rounded-[2.5rem] text-white shadow-2xl shadow-indigo-200">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-indigo-100 text-[10px] font-bold opacity-70 uppercase tracking-widest">مبيعات اليوم</p>
                        <h2 id="today-total" class="text-4xl font-black mt-1">0</h2>
                    </div>
                    <button onclick="confirmClosing()" class="bg-white/20 px-4 py-2 rounded-2xl text-[9px] font-black uppercase border border-white/10 active-press">إقفال الوردية</button>
                </div>
                <div class="mt-8 grid grid-cols-2 gap-4">
                    <div class="bg-white/10 p-4 rounded-3xl backdrop-blur-sm">
                        <p class="text-[9px] text-indigo-200 mb-1 font-bold">الدرج (كاش)</p>
                        <p id="dash-cash" class="font-black text-xl">0</p>
                    </div>
                    <div class="bg-white/10 p-4 rounded-3xl backdrop-blur-sm">
                        <p class="text-[9px] text-indigo-200 mb-1 font-bold">المحافظ</p>
                        <p id="dash-wallets" class="font-black text-xl">0</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100">
                <h4 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">النشاط الأخير</h4>
                <div id="recent-log" class="space-y-3 max-h-80 overflow-y-auto"></div>
            </div>
        </section>

        <!-- POS -->
        <section id="pos" class="tab-content space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-50">
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 mr-2 uppercase">المنتج</label>
                        <select id="pos-item" class="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold text-slate-700"></select>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 mr-2 uppercase">الكمية</label>
                            <input type="number" id="pos-qty" value="1" min="1" class="w-full p-5 bg-slate-50 rounded-3xl text-center text-2xl font-black text-indigo-600 outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-red-400 mr-2 uppercase">خصم مبلغ</label>
                            <input type="number" id="pos-discount" value="0" min="0" class="w-full p-5 bg-red-50 rounded-3xl text-center text-2xl font-black text-red-500 outline-none">
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="setPayment('cash')" id="btn-cash" class="flex-1 p-4 rounded-3xl border-2 border-indigo-600 bg-indigo-50 text-indigo-600 font-black text-xs active-press transition-all">💵 كاش</button>
                        <button onclick="setPayment('wallet')" id="btn-wallet" class="flex-1 p-4 rounded-3xl border-2 border-transparent bg-slate-50 text-slate-400 font-black text-xs active-press transition-all">📱 محفظة</button>
                    </div>

                    <div id="wallet-box" class="hidden">
                        <select id="pos-wallet" class="w-full p-5 bg-purple-50 rounded-3xl font-black text-purple-700 border border-purple-100 outline-none"></select>
                    </div>

                    <button onclick="processSale()" class="w-full bg-indigo-600 text-white p-6 rounded-[2rem] font-black text-lg active-press">إتمام البيع</button>
                </div>
            </div>
        </section>

        <!-- Stock -->
        <section id="stock" class="tab-content space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-50 shadow-sm">
                <h3 class="font-black text-slate-800 mb-4">إضافة صنف جديد</h3>
                <div class="space-y-3">
                    <input type="text" id="p-name" placeholder="اسم المنتج" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p-qty" placeholder="الكمية" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                        <input type="number" id="p-cost" placeholder="التكلفة" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold">
                    </div>
                    <input type="number" id="p-price" placeholder="سعر البيع" class="w-full p-5 bg-indigo-50 rounded-2xl outline-none font-black text-indigo-600 text-center text-xl">
                    <button onclick="saveItem()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-black">حفظ المنتج</button>
                </div>
            </div>
            <div id="stock-display" class="space-y-2"></div>
        </section>

        <!-- Settings -->
        <section id="settings" class="tab-content space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-50 shadow-sm">
                <h3 class="font-black text-slate-800 mb-4">المحافظ الإلكترونية</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="new-wallet" placeholder="اسم المحفظة" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-xs font-bold">
                    <button onclick="saveWallet()" class="bg-indigo-600 text-white px-6 rounded-2xl font-black">+</button>
                </div>
                <div id="wallets-display" class="space-y-2"></div>
            </div>
            <div class="bg-red-50 p-6 rounded-[2.5rem] border border-red-100">
                <h3 class="font-black text-red-600 mb-3 text-xs tracking-widest uppercase">تسجيل مصروف</h3>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="exp-name" placeholder="البيان" class="p-4 bg-white rounded-2xl outline-none text-xs font-bold">
                    <input type="number" id="exp-val" placeholder="المبلغ" class="p-4 bg-white rounded-2xl outline-none text-xs font-black text-red-600">
                </div>
                <button onclick="saveExp()" class="w-full mt-3 bg-red-500 text-white p-4 rounded-2xl font-black">خصم من الدرج</button>
            </div>
        </section>

        <!-- Reports -->
        <section id="reports" class="tab-content space-y-4 font-bold">
            <h3 class="font-black text-slate-800">الأرشيف</h3>
            <div id="history-display" class="space-y-3"></div>
        </section>
    </main>

    <!-- Navbar -->
    <nav class="fixed bottom-6 left-6 right-6 glass rounded-[2.5rem] border border-slate-100 p-2 flex justify-around shadow-2xl z-[100] max-w-sm mx-auto">
        <button onclick="showTab('dash')" class="nav-btn p-4 rounded-full text-indigo-600 bg-indigo-50" data-tab="dash"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></button>
        <button onclick="showTab('pos')" class="nav-btn p-4 rounded-full text-slate-300" data-tab="pos"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg></button>
        <button onclick="showTab('stock')" class="nav-btn p-4 rounded-full text-slate-300" data-tab="stock"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg></button>
        <button onclick="showTab('reports')" class="nav-btn p-4 rounded-full text-slate-300" data-tab="reports"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></button>
    </nav>

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full text-[10px] font-black opacity-0 transition-all z-[300]"></div>

    <script>
        let db = {
            stock: JSON.parse(localStorage.getItem('mb_stock')) || [],
            sales: JSON.parse(localStorage.getItem('mb_sales')) || [],
            exp: JSON.parse(localStorage.getItem('mb_exp')) || [],
            history: JSON.parse(localStorage.getItem('mb_history')) || [],
            wallets: JSON.parse(localStorage.getItem('mb_wallets')) || ['جيب', 'كريمي', 'فلوسك']
        };

        let currentPayMode = 'cash';

        function save() {
            localStorage.setItem('mb_stock', JSON.stringify(db.stock));
            localStorage.setItem('mb_sales', JSON.stringify(db.sales));
            localStorage.setItem('mb_exp', JSON.stringify(db.exp));
            localStorage.setItem('mb_history', JSON.stringify(db.history));
            localStorage.setItem('mb_wallets', JSON.stringify(db.wallets));
            render();
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-indigo-600', 'text-slate-300'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-indigo-50'));
            const btn = document.querySelector(`[data-tab="${id}"]`);
            btn.classList.replace('text-slate-300', 'text-indigo-600');
            btn.classList.add('bg-indigo-50');
        }

        function setPayment(m) {
            currentPayMode = m;
            document.getElementById('btn-cash').className = m === 'cash' ? 'flex-1 p-4 rounded-3xl border-2 border-indigo-600 bg-indigo-50 text-indigo-600 font-black text-xs' : 'flex-1 p-4 rounded-3xl border-2 border-transparent bg-slate-50 text-slate-400 font-black text-xs';
            document.getElementById('btn-wallet').className = m === 'wallet' ? 'flex-1 p-4 rounded-3xl border-2 border-purple-600 bg-purple-50 text-purple-600 font-black text-xs' : 'flex-1 p-4 rounded-3xl border-2 border-transparent bg-slate-50 text-slate-400 font-black text-xs';
            document.getElementById('wallet-box').classList.toggle('hidden', m !== 'wallet');
        }

        function processSale() {
            const sid = document.getElementById('pos-item').value;
            const qty = parseInt(document.getElementById('pos-qty').value);
            const disc = parseFloat(document.getElementById('pos-discount').value) || 0;
            const item = db.stock.find(i => i.id == sid);

            if(!item || item.qty < qty) return showToast("❌ الكمية غير متوفرة");
            const total = (item.price * qty) - disc;
            
            const sale = {
                id: Math.floor(1000 + Math.random()*9000),
                name: item.name, qty, original: item.price * qty, disc, total, cost: item.cost * qty,
                mode: currentPayMode, wallet: currentPayMode === 'wallet' ? document.getElementById('pos-wallet').value : '-',
                date: new Date().toISOString()
            };

            item.qty -= qty;
            db.sales.push(sale);
            save();
            openInvoice(sale);
            document.getElementById('pos-qty').value = 1;
            document.getElementById('pos-discount').value = 0;
        }

        function openInvoice(s) {
            document.getElementById('inv-id').innerText = "#" + s.id;
            document.getElementById('inv-date').innerText = new Date(s.date).toLocaleDateString('ar-EG');
            document.getElementById('inv-item').innerText = s.name;
            document.getElementById('inv-qty').innerText = "x" + s.qty;
            document.getElementById('inv-original-price').innerText = s.original.toLocaleString();
            if(s.disc > 0) {
                document.getElementById('inv-discount-row').classList.remove('hidden');
                document.getElementById('inv-discount-val').innerText = s.disc.toLocaleString();
            } else document.getElementById('inv-discount-row').classList.add('hidden');
            document.getElementById('inv-total').innerText = s.total.toLocaleString();
            document.getElementById('invoice-modal').classList.replace('hidden', 'flex');
        }

        function downloadPDF() {
            html2pdf().from(document.getElementById('invoice-to-save')).save();
            showToast("✅ تم الحفظ");
        }

        function closeInvoice() { document.getElementById('invoice-modal').classList.replace('flex', 'hidden'); }

        function saveItem() {
            const n = document.getElementById('p-name').value;
            const q = parseInt(document.getElementById('p-qty').value);
            const c = parseFloat(document.getElementById('p-cost').value);
            const p = parseFloat(document.getElementById('p-price').value);
            if(n) { db.stock.push({id: Date.now(), name: n, qty: q, cost: c, price: p}); save(); showToast("✅ تم الحفظ"); }
        }

        function saveExp() {
            const n = document.getElementById('exp-name').value;
            const v = parseFloat(document.getElementById('exp-val').value);
            if(n && v) { db.exp.push({id: Date.now(), name: n, val: v}); save(); showToast("💸 تم الخصم"); }
        }

        function confirmClosing() {
            if(confirm("إقفال اليومية؟")) {
                const total = db.sales.reduce((a,b) => a+b.total, 0);
                const ex = db.exp.reduce((a,b) => a+b.val, 0);
                db.history.push({date: new Date().toLocaleDateString('ar-EG'), net: total - ex});
                db.sales = []; db.exp = []; save();
            }
        }

        function render() {
            document.getElementById('pos-item').innerHTML = '<option value="">الصنف</option>' + db.stock.map(i => `<option value="${i.id}">${i.name} (${i.qty})</option>`).join('');
            document.getElementById('pos-wallet').innerHTML = db.wallets.map(w => `<option value="${w}">${w}</option>`).join('');
            document.getElementById('stock-display').innerHTML = db.stock.map(i => `<div class="bg-white p-4 rounded-2xl flex justify-between shadow-sm"><span>${i.name} (${i.qty})</span><span class="font-black text-indigo-600">${i.price}</span></div>`).join('');
            document.getElementById('recent-log').innerHTML = [...db.sales, ...db.exp].reverse().map(l => `<div class="p-3 border-b border-slate-50 flex justify-between text-xs font-bold"><span>${l.name}</span><span class="${l.total?'text-green-600':'text-red-600'}">${l.total || -l.val}</span></div>`).join('');
            
            const sTotal = db.sales.reduce((a,b) => a+b.total, 0);
            const cTotal = db.sales.filter(s => s.mode === 'cash').reduce((a,b) => a+b.total, 0);
            const wTotal = db.sales.filter(s => s.mode === 'wallet').reduce((a,b) => a+b.total, 0);
            const eTotal = db.exp.reduce((a,b) => a+b.val, 0);

            document.getElementById('today-total').innerText = sTotal.toLocaleString();
            document.getElementById('dash-cash').innerText = (cTotal - eTotal).toLocaleString();
            document.getElementById('dash-wallets').innerText = wTotal.toLocaleString();
            document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('ar-EG', {weekday: 'long', day: 'numeric', month: 'long'});
        }

        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        window.onload = () => render();
    </script>
</body>
</html>
